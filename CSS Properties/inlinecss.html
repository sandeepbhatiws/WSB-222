<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>

    <div style="width: 500px; height: 500px; background-color: red; display: flex;">
        <div style="width: 250px; background-color: black; color:white;">
            <center>Home</center>
        </div>
        <div style="width: 250px; background-color: blue; color:white;">
            <center>About Us</center>
        </div>
    </div>

    <br><br><br>


    <div style="width: 500px; height: 500px; background-color: black; color:white;">
        <div style="height: 250px; background-color: red;">
            <center>Home</center>
        </div>
        <div style="background-color: blue; height: 250px;">
            <center>About Us</center>
        </div>
    </div>
</body>
</html>
